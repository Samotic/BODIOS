# Every exercise demo in the catalogue plays its own bundled clip on the
# device (the timeline must pass 2 s), and exercises without a licensed clip
# say so. Screenshots: catalogue-<exercise id>.
# Run: maestro test .maestro/video-catalogue.yaml
appId: org.reactjs.native.example.Bodios
---
- launchApp:
    stopApp: true
- tapOn: "Workouts, tab.*"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "back squat"
      ID: "barbell-back-squat"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "barbell bench"
      ID: "barbell-bench-press"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "pushdown"
      ID: "cable-triceps-pushdown"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "dumbbell bench"
      ID: "dumbbell-bench-press"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "dumbbell curl"
      ID: "dumbbell-curl"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "lateral"
      ID: "dumbbell-lateral-raise"
- runFlow:
    file: subflows/play-demo.yaml
    env:
