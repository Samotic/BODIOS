      QUERY: "hammer"
      ID: "hammer-curl"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "incline"
      ID: "incline-dumbbell-press"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "pulldown"
      ID: "lat-pulldown"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "leg press"
      ID: "leg-press"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "overhead"
      ID: "overhead-dumbbell-triceps-extension"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "plank"
      ID: "plank"
- runFlow:
    file: subflows/play-demo.yaml
    env:
      QUERY: "pull"
